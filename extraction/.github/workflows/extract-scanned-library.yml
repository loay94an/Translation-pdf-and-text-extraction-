name: Extract scanned fashion reference library

on:
  push:
    branches:
      - feat/automated-library-progress-dashboard
      - perf/parallel-resumable-library-ocr
    paths:
      - "scripts/analyze_scanned_pages.py"
      - "scripts/scan_all_books_parallel.py"
      - "scripts/build_progress_dashboard.py"
      - "extract_pages.py"
      - ".github/workflows/extract-scanned-library.yml"
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scanned-library-extraction-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository and LFS assets
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - name: Validate Python syntax
        run: python3 -m py_compile scripts/scan_all_books_parallel.py scripts/analyze_scanned_pages.py scripts/build_progress_dashboard.py scripts/validate_progress_ledger.py
      - name: Pull LFS objects
        run: git lfs pull
      - name: Install PDF and OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng tesseract-ocr-por tesseract-ocr-ita
          tesseract --list-langs
          git lfs version
      - name: Scan all books in parallel and extract searchable text
        run: python3 scripts/scan_all_books_parallel.py --book-workers 8
      - name: Analyze visual pages and OCR sparse priority pages
        run: |
          python3 scripts/analyze_scanned_pages.py \
            --ocr-book-ids "*" \
            --ocr-threshold 45 --dpi 150 --workers 4
      - name: Build Arabic progress dashboard
        if: always()
        run: python3 scripts/build_progress_dashboard.py
      - name: Validate sanitized page progress ledger
        id: validate_ledger
        if: always()
        run: python3 scripts/validate_progress_ledger.py
      - name: Upload extraction snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fashion-reference-extraction
          path: |
            assets/fashion-model-library/extracted-knowledge/extraction-report.json
            assets/fashion-model-library/extracted-knowledge/visual-extraction-report.json
            assets/fashion-model-library/extracted-knowledge/page-visual-index.jsonl
            assets/fashion-model-library/extracted-knowledge/library-progress.json
            assets/fashion-model-library/extracted-knowledge/page-progress-ledger.jsonl
            assets/fashion-model-library/LIBRARY_PROGRESS_AR.md
          if-no-files-found: warn
          retention-days: 30
      - name: Commit extracted knowledge to this branch
        if: always() && steps.validate_ledger.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keep full extracted book text and OCR private to the ephemeral runner.
          # Only derived metadata and progress indicators are persisted to this repository.
          for path in \
            assets/fashion-model-library/extracted-knowledge/extraction-report.json \
            assets/fashion-model-library/extracted-knowledge/visual-extraction-report.json \
            assets/fashion-model-library/extracted-knowledge/page-visual-index.jsonl \
            assets/fashion-model-library/extracted-knowledge/library-progress.json \
            assets/fashion-model-library/extracted-knowledge/page-progress-ledger.jsonl \
            assets/fashion-model-library/LIBRARY_PROGRESS_AR.md; do
            if [ -f "$path" ]; then git add "$path"; fi
          done
          if git diff --cached --quiet; then
            echo "No new extraction output to commit."
          else
            git commit -m "Add OCR and visual page extraction results"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
