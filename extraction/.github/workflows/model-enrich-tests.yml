name: Model extraction unit tests

on:
  push:
    branches:
      - feat/scanned-library-extraction-pipeline
    paths:
      - "scripts/model_enrich.py"
      - "tests/test_model_enrich.py"
      - ".github/workflows/model-enrich-tests.yml"
  pull_request:
    paths:
      - "scripts/model_enrich.py"
      - "tests/test_model_enrich.py"
      - ".github/workflows/model-enrich-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test model extraction parser and resume behavior
        run: python -m unittest discover -s tests -v
