name: Android control center build

on:
  push:
    branches: [main]
    paths:
      - 'apps/control-center/mobile-agent/android-app/**'
      - '.github/workflows/android-control-center-build.yml'
  pull_request:
    paths:
      - 'apps/control-center/mobile-agent/android-app/**'
      - '.github/workflows/android-control-center-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        working-directory: apps/control-center/mobile-agent/android-app
        run: gradle --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: control-center-debug-apk
          path: apps/control-center/mobile-agent/android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
