name: Mobile terminal agent checks
on:
  push:
    branches: [main]
    paths:
      - 'apps/control-center/mobile-agent/**'
      - 'apps/control-center/public/mobile-terminal.html'
      - 'apps/control-center/public/studio.html'
      - 'apps/control-center/mobile-agent/check-studio.mjs'
      - 'extraction/scripts/extract_single_pdf.py'
      - '.github/workflows/mobile-terminal-check.yml'
  pull_request:
    paths:
      - 'apps/control-center/mobile-agent/**'
      - 'apps/control-center/public/mobile-terminal.html'
      - 'apps/control-center/public/studio.html'
      - 'apps/control-center/mobile-agent/check-studio.mjs'
      - 'extraction/scripts/extract_single_pdf.py'
      - '.github/workflows/mobile-terminal-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check PDF page exporter syntax
        run: python -m py_compile extraction/scripts/extract_single_pdf.py
      - name: Check Termux agent syntax
        run: node --check apps/control-center/mobile-agent/agent.mjs
      - name: Check professional studio dashboard
        run: node apps/control-center/mobile-agent/check-studio.mjs
      - name: Check Android project files exist
        run: |
          test -f apps/control-center/mobile-agent/android-app/app/src/main/java/com/loay94an/controlcenter/MainActivity.kt
          test -f apps/control-center/mobile-agent/android-app/gradle.properties
      - name: Check extraction controls reference imported engine paths
        run: |
          grep -q 'EXTRACTION_ROOT' apps/control-center/mobile-agent/start.sh
          grep -q 'EXTRACTION_ROOT' apps/control-center/public/mobile-terminal.html
          grep -q '/api/extracted-pages' apps/control-center/public/mobile-terminal.html
          grep -q '/api/extracted-pages' apps/control-center/mobile-agent/agent.mjs
          grep -q 'studio.html' apps/control-center/public/mobile-terminal.html
